services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zhuatech_aiproductionscheduler
      MYSQL_USER: ${DB_USERNAME:-zhuatech}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-me}
    volumes: [aiproductionscheduler_mysql:/var/lib/mysql]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 10s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zhuatech_aiproductionscheduler?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${DB_USERNAME:-zhuatech}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
    depends_on: {mysql: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "if command -v nc >/dev/null 2>&1; then nc -z 127.0.0.1 8080; else bash -c '</dev/tcp/127.0.0.1/8080'; fi"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
  frontend:
    build: ./frontend
    ports: ["8502:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  aiproductionscheduler_mysql:
